<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Downloader</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1b1d22; --muted:#6b7280; --line:#e4e6eb; --accent:#2f6fed; --accent-text:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --card:#1a1d23; --text:#e8eaee; --muted:#9aa1ad; --line:#2a2e36; --accent:#5b8cff; --accent-text:#0b0d10; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
         background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif; }
  form { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; width:100%; max-width:360px; }
  h1 { font-size:20px; margin:0 0 6px; }
  p { color:var(--muted); font-size:14px; margin:0 0 16px; }
  input { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
  button { width:100%; margin-top:12px; padding:11px; border:0; border-radius:8px; background:var(--accent); color:var(--accent-text); font:inherit; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
  <form method="get" action="/">
    <h1>Media Downloader</h1>
    <p>접속 키를 입력하세요. 다운로더를 켠 PC 화면의 QR 코드를 찍으면 자동으로 들어가요.</p>
    <input name="key" autocomplete="off" placeholder="접속 키" required autofocus>
    <button>들어가기</button>
  </form>
</body>
</html>
